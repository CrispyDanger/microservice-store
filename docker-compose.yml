x-app: &app
  build: &app-build
    context: .
    dockerfile: Dockerfile
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  depends_on:
    kafka-init:
      condition: service_completed_successfully

x-user: &user
  build:
    context: .
    dockerfile: Dockerfile
    args: { SERVICE: user, DEV: "true" } # DEV=true installs pytest/httpx for running tests
  env_file: .env # container values: DB at user-db:5432, keys at /keys
  volumes:
    - ./services/user/keys:/keys:ro
    # Bind mounts (two-way): code edits reach the container, and files the container
    # creates (new migrations from makemigrations) show up in your project.
    - ./services/user/src:/app/services/user/src
    - ./services/user/tests:/app/services/user/tests
    # libs/auth is installed editable, so lib edits apply without a rebuild too
    - ./libs/auth/src:/app/libs/auth/src
    - ./libs/auth/tests:/app/libs/auth/tests
  depends_on:
    user-db: { condition: service_healthy }

x-postgres: &postgres
  image: postgres:18
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
    interval: 5s
    retries: 10

services:
  kafka:
    image: apache/kafka:latest
    hostname: kafka
    ports:
      - "9092:9092" # for code running on your machine
    volumes:
      - kafka-data:/var/lib/kafka/data # survives `down`; wiped only by `down -v`
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data # where topics, messages and offsets are stored
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT = inside the Docker network, PLAINTEXT_HOST = from your machine
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # kafka-init creates them
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in orders inventory payments; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  #########################################################
  # Order Service
  #########################################################
  order-db:
    <<: *postgres
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
      POSTGRES_DB: order
    ports: ["5434:5432"]
    volumes: [order-db-data:/var/lib/postgresql]

  order:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: order, DEV: "true" }
    env_file: .env # ORDER_* values: DB at order-db:5432, public key at /keys/public.pem
    command: ["uvicorn", "order.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      # Only the public key: order can verify tokens but never mint them
      - ./services/user/keys/public.pem:/keys/public.pem:ro
      - ./services/order/src:/app/services/order/src
      # Workspace libs are installed editable, so lib edits apply without a rebuild
      - ./libs/auth/src:/app/libs/auth/src
      - ./libs/events/src:/app/libs/events/src
    ports:
      - "8000:8000"
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      order-db: { condition: service_healthy }

  notifications:
    <<: *app
    build:
      <<: *app-build
      args: { SERVICE: notifications }

  #########################################################
  # User Service
  #########################################################
  user-db:
    <<: *postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: user
    ports: ["5433:5432"]
    volumes: [user-db-data:/var/lib/postgresql]

  # One-shot job: applies migrations once, then exits (same pattern as kafka-init)
  user-migrate:
    <<: *user
    command: ["tortoise", "-c", "user.db.TORTOISE_ORM", "migrate"]

  user:
    <<: *user
    # --reload restarts the app when files in the mounted src change
    command: ["uvicorn", "user.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    environment:
      # File-change events don't reach containers through Windows bind mounts; poll instead
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8001:8001"
    depends_on:
      user-db:
        condition: service_healthy
      user-migrate:
        condition: service_completed_successfully

  # Add inventory / payment / user the same way once they do something:
  # inventory:
  #   <<: *app
  #   build: { <<: *app-build, args: { SERVICE: inventory } }

volumes:
  kafka-data:
  user-db-data:
  order-db-data:
