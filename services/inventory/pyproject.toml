[project]
name = "inventory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Artem Yakovenko", email = "crispyd2405@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.15.0",
    "auth",
    "events",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
    "tortoise-orm[asyncpg]>=1.1.9",
]

[project.scripts]
inventory = "inventory.main:run"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
auth = { workspace = true }
events = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
